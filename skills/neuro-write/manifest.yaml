name: neuro-write
version: 0.1.0

# Read on every neuro-write invocation: the shared neuroimaging layer plus this
# stage's journal-agnostic core.
always_load:
  - ../_shared/core/neuro-invariants.md
  - ../_shared/core/modality-taxonomy.md
  - ../_shared/core/terminology-ledger.md
  - ../_shared/core/style-discipline-tier.md
  - static/core/stance.md
  - static/core/workflow.md
  - static/core/style-rules.md

# The ONLY file-backed axis. The journal selects a prose fragment; the venue's
# actual *rules* are a runtime YAML overlay resolved by the router (SKILL.md
# Step 3.5), NOT a fragment. Only 'generic' and 'mia' ship as prose.
axes:
  journal:
    detect: >
      the journal the user names. If a runtime venue profile exists for it, load
      'generic' prose and apply that profile as the overlay. If it is MIA, load
      'mia'. Otherwise 'generic'.
    values:
      generic: static/fragments/journal/generic.md
      mia: static/fragments/journal/mia.md
    default: generic
    multi: false

# Loaded only when the described situation arises — keeps the context lean.
references:
  on_demand:
    - condition: drafting or auditing a Methods architecture section
      path: static/core/methods-structure.md
    - condition: any figure or caption work
      path: static/core/figure-discipline.md
    - condition: need published-venue exemplar patterns
      path: references/exemplar_patterns.md
    - condition: grounding [CITE:] placeholders in real, verifiable references
      path: references/grounded-citation-search.md
